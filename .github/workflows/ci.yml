name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            command: uv run --no-sync pytest -q
          - name: lint
            command: uv run --no-sync ruff check app tests alembic scripts .claude/hooks .cursor/hooks
          - name: docs
            command: uv run --no-sync mkdocs build --strict
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          # Cache writes need actions: write. This workflow is contents: read only.
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra docs

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
